name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace assembleRelease testReleaseUnitTest -x lint
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/NeuroCam.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroCam-apk
          path: out/NeuroCam.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
