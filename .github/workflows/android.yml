name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build APK and run unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease testReleaseUnitTest -x lint 2>&1 | tee build.log
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/NeuroCam.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroCam-apk
          path: out/NeuroCam.apk
      - name: Failure summary
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -nE "error:|warning: \[|What went wrong|FAILED|Exception|expected|but was" build.log | head -80 || true
          echo "=== TAIL ==="
          tail -60 build.log || true
