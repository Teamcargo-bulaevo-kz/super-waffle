name: Android build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build APK and run unit tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease testReleaseUnitTest -x lint 2>&1 | tee build.log
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/NeuroCam.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroCam-apk
          path: out/NeuroCam.apk
      - name: Failure summary
        if: failure()
        run: |
          echo "=== ERRORS ==="
          grep -nE "error:|What went wrong|FAILED|Could not|expected:|but was" build.log | head -60 || true
          echo "=== TAIL ==="
          tail -40 build.log || true

  device-test:
    # runs the AI pipeline and a real capture on an Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -x lint
      - name: Run instrumented AI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat -v brief NeuroCamTest:I NeuroEnhancer:I TestRunner:I AndroidRuntime:E *:S > logcat.txt &
            ./gradlew --no-daemon connectedDebugAndroidTest -x lint -Pandroid.testInstrumentationRunnerArguments.class=net.sourceforge.opencamera.NeuroCamInstrumentedTest > device-test.log 2>&1 || (echo DEVICE_TEST_FAILED > failed.txt)
            sleep 2
      - name: Device test summary
        if: always()
        run: |
          echo "=== AI RESULTS ==="
          grep -h "AI_RESULT\|NeuroEnhancer\|FATAL\|Exception" logcat.txt | head -60 || true
          echo "=== TEST RESULTS ==="
          grep -hoE '<testcase [^>]*>|<failure message="[^"]{0,400}' app/build/outputs/androidTest-results/connected/debug/*.xml 2>/dev/null | head -30 || true
          grep -nE "What went wrong|FAILED|tests completed" device-test.log | head -20 || true
          if [ -f failed.txt ]; then tail -30 device-test.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-logs
          path: |
            logcat.txt
            device-test.log
            app/build/outputs/androidTest-results/

  release:
    needs: [build, device-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NeuroCam-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: neurocam-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: NeuroCam AI Camera (build ${{ github.run_number }})
          make_latest: true
          body: |
            NeuroCam — AI camera based on Open Camera 1.56.2.
            Install NeuroCam.apk on Android 6.0+ (allow installing from unknown sources).
            Built and tested automatically by GitHub Actions (unit tests + emulator AI tests).
          files: NeuroCam.apk
